name: Build Windows 11 exe

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp build info
        id: stamp_info
        shell: pwsh
        run: |
          $content = Get-Content ShowDesktopOneMonitor/BuildInfo.cs -Raw
          $version = "1.1"
          if ($content -match 'Version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
          }
          $sha = "${{ github.sha }}"
          $run = "${{ github.run_number }}"
          $code = "namespace ShowDesktopOneMonitor`r`n{`r`n    internal static class BuildInfo`r`n    {`r`n        public const string Version = `"$version`";`r`n        public const string CommitSha = `"$sha`";`r`n        public const string BuildNumber = `"$run`";`r`n    }`r`n}"
          Set-Content -Path ShowDesktopOneMonitor/BuildInfo.cs -Value $code -Encoding UTF8
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build (Release, net48)
        run: dotnet build ShowDesktopOneMonitor/ShowDesktopOneMonitor.csproj -c Release

      - name: Check build output
        shell: pwsh
        run: |
          $exe = "ShowDesktopOneMonitor/bin/Release/net48/ShowDesktopOneMonitor.exe"
          if (-not (Test-Path $exe)) { throw "build output missing: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Package full zip for the Actions artifact
        shell: pwsh
        run: |
          $out = "ShowDesktopOneMonitor/bin/Release/net48"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$out/ShowDesktopOneMonitor.exe" dist/
          if (Test-Path "$out/ShowDesktopOneMonitor.exe.config") {
            Copy-Item "$out/ShowDesktopOneMonitor.exe.config" dist/
          }
          Copy-Item README.md dist/
          Copy-Item README.zh-CN.md dist/
          Compress-Archive -Path dist/* -DestinationPath ShowDesktopOneMonitor-win11.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowDesktopOneMonitor-win11
          path: ShowDesktopOneMonitor-win11.zip
          if-no-files-found: error

      - name: Generate release notes
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $shortSha = if ($sha.Length -ge 7) { $sha.Substring(0, 7) } else { $sha }
          $run = "${{ github.run_number }}"
          $header = "Automatically built from `${shortSha}` (workflow run #${run}).`r`n"
          if (Test-Path release_notes.md) {
            $existing = Get-Content release_notes.md -Raw -Encoding UTF8
            $notes = $header + "`r`n" + $existing
          } else {
            $notes = $header
          }
          Set-Content -Path release_notes.md -Value $notes -Encoding UTF8

      # Creates or updates a release for the current version (e.g. v1.1).
      # Subsequent new versions publish new releases, and all historical releases
      # are preserved in the repository.
      - name: Publish version release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stamp_info.outputs.version }}
          name: ShowDesktopOneMonitor v${{ steps.stamp_info.outputs.version }}
          body_path: release_notes.md
          files: ShowDesktopOneMonitor/bin/Release/net48/ShowDesktopOneMonitor.exe
          make_latest: true
          prerelease: false
          draft: false
