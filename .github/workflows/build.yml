name: Build Windows 11 exe

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stamp build info
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $run = "${{ github.run_number }}"
          $code = "namespace ShowDesktopOneMonitor`r`n{`r`n    internal static class BuildInfo`r`n    {`r`n        public const string CommitSha = `"$sha`";`r`n        public const string BuildNumber = `"$run`";`r`n    }`r`n}"
          Set-Content -Path ShowDesktopOneMonitor/BuildInfo.cs -Value $code -Encoding UTF8

      - name: Build (Release, net48)
        run: dotnet build ShowDesktopOneMonitor/ShowDesktopOneMonitor.csproj -c Release

      - name: Check build output
        shell: pwsh
        run: |
          $exe = "ShowDesktopOneMonitor/bin/Release/net48/ShowDesktopOneMonitor.exe"
          if (-not (Test-Path $exe)) { throw "build output missing: $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Package full zip for the Actions artifact
        shell: pwsh
        run: |
          $out = "ShowDesktopOneMonitor/bin/Release/net48"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$out/ShowDesktopOneMonitor.exe" dist/
          if (Test-Path "$out/ShowDesktopOneMonitor.exe.config") {
            Copy-Item "$out/ShowDesktopOneMonitor.exe.config" dist/
          }
          Copy-Item README.md dist/
          Copy-Item README.zh-CN.md dist/
          Compress-Archive -Path dist/* -DestinationPath ShowDesktopOneMonitor-win11.zip -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowDesktopOneMonitor-win11
          path: ShowDesktopOneMonitor-win11.zip
          if-no-files-found: error

      - name: Generate release notes
        shell: pwsh
        run: |
          $commitMsg = git log -1 --pretty=format:"%s%n%n%b"
          $notes = "Automatically built from `${{ github.sha }}` (workflow run #${{ github.run_number }}).`r`n`r`n### 变更说明 / What's Changed`r`n$commitMsg`r`n`r`n---`r`n- 包含单文件: ``ShowDesktopOneMonitor.exe```r`n- 运行环境: .NET Framework 4.8 (Windows 10 2004+ 与 Windows 11 自带)"
          Set-Content -Path release_notes.md -Value $notes -Encoding UTF8

      # A single rolling release. It is reused on every build and the asset is
      # replaced, so there is never more than one release and it always holds
      # only the newest exe.
      - name: Publish the newest exe to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (Windows 11)
          body_path: release_notes.md
          files: ShowDesktopOneMonitor/bin/Release/net48/ShowDesktopOneMonitor.exe
          make_latest: true
          prerelease: false
          draft: false
